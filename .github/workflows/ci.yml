---
name: ci
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  CLICOLOR: 1
jobs:
  test:
    needs: [check, fmt, clippy, build-storage, build-storage-lake]
    timeout-minutes: 60
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        pg:
          - postgres:16
          - postgres:17
          - postgres:18
    env:
      ADVERTISED_LISTENER_URL: tcp://localhost:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT: http://localhost:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CARGO_BUILD_BUILD_DIR: /mnt/build
      CLUSTER_ID: jansu-ci
      DATA_LAKE: s3://lake
      ICEBERG_CATALOG: http://localhost:8181/catalog
      ICEBERG_WAREHOUSE: jansu
      LAKEKEEPER_IMAGE: quay.io/lakekeeper/catalog:v0.8.5
      POSTGRES_IMAGE: ${{matrix.pg}}
      PROMETHEUS_LISTENER_URL: tcp://[::]:9100
      RUST_BACKTRACE: 1
      RUST_LOG: debug,jansu_sans_io=warn,jansu_model=warn
      SCHEMA_REGISTRY: file://./etc/schema
      STORAGE_ENGINE: s3://jansu/
      JANSU_IMAGE: ghcr.io/jansu-io/jansu
    steps:
      - run: sudo mkdir /mnt/build
      - run: sudo chmod a+rwxt /mnt/build
      - run: echo "PG_IMAGE_DASH=${POSTGRES_IMAGE/:/-}" >> $GITHUB_ENV
      - run: echo ${PG_IMAGE_DASH}
      - run: df -h
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy, rustfmt
          cache: false
      - name: Run CI test lane
        run: bash ops/ci/test.sh
      - run: df -h
        if: always()
      - run: ls -l
        if: always()
      - run: tar --create --verbose --gzip --file=logs-${{env.PG_IMAGE_DASH}}.tar.gz logs
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: logs-${{env.PG_IMAGE_DASH}}.tar.gz
          path: logs-${{env.PG_IMAGE_DASH}}.tar.gz
          if-no-files-found: error
      - run: du -sh target
      - run: docker system df
      - run: df -h
  check:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy, rustfmt
          cache: false
      - run: just check
      - run: just compatibility-contract
  fmt:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy, rustfmt
          cache: false
      - run: just fmt
  clippy:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy, rustfmt
          cache: false
      - run: just clippy
  build-storage:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        storage:
          - dynostore
          - libsql
          - postgres
          - slatedb
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy, rustfmt
          cache: false
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - run: cargo build --features ${{matrix.storage}}
  build-storage-lake:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        storage:
          - dynostore
          - libsql
          - postgres
          - slatedb
        lake:
          - delta
          - iceberg
          - parquet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy, rustfmt
          cache: false
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - run: cargo build --features ${{matrix.storage}} --features ${{matrix.lake}}
  cargo-publish-dry-run:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
      - run: sudo apt-get install -y libclang-dev libkrb5-dev
      - run: cargo package --workspace
      - run: find target/package -name "*.crate" -exec sha256sum {} \; | tee target/package/checksums.sha256
      - run: cargo publish --dry-run --workspace
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: crate-ci/typos@a8d8e187146634c459c27ade2d3e338569378720
        with:
          config: typos.toml
  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: |
          git archive --format=tar.gz HEAD >${{runner.temp}}/src.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: src
          path: ${{runner.temp}}/src.tar.gz
          if-no-files-found: error
  package:
    needs: [test, cargo-publish-dry-run, typos]
    runs-on: ${{matrix.os}}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        id: meta
        with:
          images: ${{env.REGISTRY}}/${{github.repository}}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{github.actor == 'shortishly'}}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  smoke:
    if: ${{github.actor == 'shortishly'}}
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        storage:
          - s3://jansu/
          - postgres://postgres:postgres@db
          - sqlite://jansu.db
        kafka:
          - apache/kafka:3.9.0
          - apache/kafka:3.8.1
          - apache/kafka:3.7.0
    runs-on: ${{matrix.os}}
    env:
      ADVERTISED_LISTENER_URL: tcp://jansu:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT: http://minio:9000
      AWS_SECRET_ACCESS_KEY: minioadmin
      CLUSTER_ID: kafka-python-integration
      KAFKA_IMAGE: ${{matrix.kafka}}
      PROMETHEUS_LISTENER_URL: tcp://localhost:9100
      RUST_BACKTRACE: 1
      RUST_LOG: warn,jansu_broker=debug,jansu_storage=debug,jansu_schema=debug
      STORAGE_ENGINE: ${{matrix.storage}}
    steps:
      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        id: meta
        with:
          images: ${{env.REGISTRY}}/${{github.repository}}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: jansu-io/example-java
          path: integration
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: |
            etc/initdb.d/010-schema.sql
          sparse-checkout-cone-mode: false
          path: initdb
      - run: ls -lR
      - run: cp -v initdb/etc/initdb.d/010-schema.sql integration/etc/initdb.d
      - run: docker compose --ansi never --progress plain up --no-color --quiet-pull --detach
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
      - run: docker compose --ansi never exec minio /usr/bin/mc ready local
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
      # Alias set removed for security: relying on pre-configured MinIO credentials
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
      - run: docker compose --ansi never exec minio /usr/bin/mc mb local/jansu
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
      - run: sudo apt-get update
      - run: sudo apt-get install -y bats
      - run: docker compose exec db /usr/bin/pg_isready --timeout=60
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
      - run: docker compose logs
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
      - run: bats --trace --verbose-run tests
        working-directory: integration
        env:
          JANSU_IMAGE: ghcr.io/jansu-io/jansu:${{steps.meta.outputs.version}}
  security:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run security lane
        run: ./tools/security-lane.sh

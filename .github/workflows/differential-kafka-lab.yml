name: differential-kafka-lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AUDIT.md"
      - "MASTER_PLAN.md"
      - "docs/compatibility/**"
      - "etc/differential/**"
      - "jansu-broker/tests/differential_lab.rs"
      - "jansu-broker/tests/compatibility_contract.rs"
      - "phase-logs/**"
      - "tips/phases/04-differential-kafka-lab.md"
      - "justfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase04-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Run differential Kafka lab
        run: bash ops/ci/diff-lab.sh

      - name: Upload differential artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase04-differential-artifacts
          path: target/differential

name: differential-kafka-lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AUDIT.md"
      - "MASTER_PLAN.md"
      - "docs/compatibility/**"
      - "etc/differential/**"
      - "jansu-broker/tests/differential_lab.rs"
      - "jansu-broker/tests/compatibility_contract.rs"
      - "phase-logs/**"
      - "tips/phases/04-differential-kafka-lab.md"
      - "justfile"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase04-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Run differential Kafka lab
        run: bash ops/ci/diff-lab.sh

      - name: Upload differential artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase04-differential-artifacts
          path: target/differential

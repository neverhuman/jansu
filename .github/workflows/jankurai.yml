name: jankurai

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run workflow linting
        run: zizmor . > zizmor.txt || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: Swatinem/rust-cache@23bcedea146cecece289c0a6b7e889eb2260f719
      - name: Install jankurai
        run: cargo install jankurai --locked
      - name: Run jankurai audit lane
        run: bash ops/ci/jankurai.sh

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360
        if: always()
        with:
          sarif_file: target/jankurai/jankurai.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: |
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/jankurai.sarif
            target/jankurai/repair-queue.jsonl
            target/jankurai/security/evidence.json
            target/jankurai/ux-qa.json
            target/jankurai/migration-report.json
            target/jankurai/rust/witness-graph.json
            target/jankurai/proofbind/
            target/jankurai/proofmark/
            target/jankurai/language-bad-behavior.log
            target/jankurai/authz/
            target/jankurai/input-boundary/
            target/jankurai/agent-tool-supply/
            target/jankurai/release/
            target/jankurai/cost/
            target/jankurai/db/

name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release steps without publishing artifacts'
        required: false
        default: 'true'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, security]
    env:
      CLICOLOR: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          components: clippy,rustfmt
          cache: false

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      # ---------- Build ----------
      - name: Build release binary
        run: just release

      - name: Build Docker image
        run: just docker-build

      # ---------- Test ----------
      - name: Run test suite
        run: just test

      # ---------- Security ----------
      - name: Run security lane
        run: ./tools/security-lane.sh

      # ---------- Publish (only on tag, not dry‑run) ----------
      - name: Log in to GitHub Container Registry (if not dry‑run)
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && inputs.dry_run != 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image (if not dry‑run)
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && inputs.dry_run != 'true' }}
        run: docker push ghcr.io/jansu-io/jansu

      # ---------- Integrity ----------
      - name: Generate release checksums
        run: |
          sha256sum target/release/jansu > target/release/jansu.sha256
          cat target/release/jansu.sha256

      - name: Create GitHub release (if not dry‑run)
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/jansu
            target/release/jansu.sha256

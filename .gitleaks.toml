title = "gitleaks config"

[allowlist]
  description = "project-level allowlist: placeholder credentials, dev defaults, and content-integrity fingerprints"
  regexTarget = "line"
  regexes = [
    # Default PostgreSQL URL with placeholder credentials
    '''postgresql://[^:]+:postgres@''',
    # Default minio credentials used in compose.yaml / example.env
    '''minioadmin''',
    # Placeholder encryption key in example.env / docs
    '''This-is-NOT-Secure!''',
    # Content-integrity fingerprints in generated audit artefacts (agent/repo-score.*)
    '''sha256:[0-9a-f]{64}''',
  ]

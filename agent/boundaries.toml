[stack]
id = "rust-postgres-kafka-native"
version = "0.5.0"

[audit]
exclude_paths = [
  ".claude/",
  ".claude/worktrees/",
  "target/",
]
no_web_ui = true
no_rendered_ux = true


[rust]
domain_paths = ["crates/domain", "crates/*/src/domain"]
forbidden_domain_imports = [
  "std::fs",
  "std::env",
  "std::net",
  "std::time::SystemTime",
  "rand::",
  "sqlx::",
  "diesel::",
  "reqwest::",
  "rdkafka::",
  "tracing::",
  "log::"
]

[typescript]
web_paths = ["apps/web", "packages/web", "packages/ui"]
forbidden_web_imports = ["sqlx", "pg", "postgres", "mysql", "better-sqlite3", "@aws-sdk/client-s3"]
generated_contract_paths = ["contracts/generated"]

[queues]
adapter_paths = ["crates/adapters/queues", "crates/adapters/src/queues"]
event_contract_paths = ["contracts/events"]
generated_type_paths = ["contracts/generated"]
client_markers = ["rdkafka", "kafkajs", "jansu", "iggy", "fluvio", "nats", "redis streams"]

[[streaming_exception]]
runtime = "kafka"
classification = "brownfield"
owner = "platform"
expires = "2026-12-31"
migration_path = "Keep Kafka behind generated event contracts and observable Rust queue adapters; evaluate Jansu, Apache Iggy, and Fluvio with replay, compatibility, and operations proof before replacement."

[db]
root_paths = ["db"]
migration_paths = ["db/migrations"]
constraint_paths = ["db/constraints"]

[audit]
exclude_paths = [
    ".claude/",
    ".claude/worktrees/",
    "target/",
]
no_rendered_ux = true
no_web_ui = true

[db]
constraint_paths = ["db/constraints"]
migration_paths = ["db/migrations"]
root_paths = ["db"]

[python]
allowed_truth_paths = ["python/ai-service"]

[queues]
adapter_paths = [
    "crates/adapters/queues",
    "crates/adapters/src/queues",
]
client_markers = [
    "rdkafka",
    "kafkajs",
    "jansu",
    "iggy",
    "fluvio",
    "nats",
    "redis streams",
    "tansu",
]
event_contract_paths = ["contracts/events"]
generated_type_paths = ["contracts/generated"]

[rust]
domain_paths = [
    "crates/domain",
    "crates/*/src/domain",
]
forbidden_domain_imports = [
    "std::fs",
    "std::env",
    "std::net",
    "std::time::SystemTime",
    "rand::",
    "sqlx::",
    "diesel::",
    "reqwest::",
    "rdkafka::",
    "tracing::",
    "log::",
]

[stack]
id = "rust-postgres-kafka-native"
version = "0.5.0"

[[streaming_exception]]
classification = "brownfield"
expires = "2026-12-31"
migration_path = "Keep Kafka behind generated event contracts and observable Rust queue adapters; evaluate Jansu, Apache Iggy, and Fluvio with replay, compatibility, and operations proof before replacement."
owner = "platform"
runtime = "kafka"

[[streaming_exception]]
classification = "brownfield"
expires = "2026-12-31"
migration_path = "Keep Kafka behind generated event contracts and observable Rust queue adapters; evaluate Tansu, Apache Iggy, and Fluvio with replay, compatibility, and operations proof before replacement."
owner = "platform"
runtime = "kafka"

[typescript]
forbidden_web_imports = [
    "sqlx",
    "pg",
    "postgres",
    "mysql",
    "@aws-sdk/client-s3",
]
generated_contract_paths = ["contracts/generated"]
web_paths = []
